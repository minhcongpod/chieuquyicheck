name: Deploy Firebase Hosting

# Mỗi lần code vào nhánh main, GitHub tự build rồi đưa lên Firebase Hosting.
# Cần secret FIREBASE_SERVICE_ACCOUNT (nội dung file JSON service account của dự án chieuquyicheck).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: chieuquyicheck
          channelId: live
